🛰️ Agent marché dans VISION FUTURE

Le worker surveille aussi les positions que tu possèdes déjà. Il peut donc créer une alerte quand une position se dégrade, quand le momentum se retourne, quand le cours passe sous certains niveaux relatifs au PRU, ou quand un gain commence à être menacé.

Le niveau minimal reste bien +3 % avec actuellement :

Potentiel ≥ 3 %
R/R ≥ 2
Score daily ≥ 76
Confirmation 1H ≥ 65

L’agent d’actualité utilise l’API OpenAI avec l’outil de recherche web. L’API Responses supporte actuellement l’appel d’un modèle avec l’outil web_search, donc le worker peut réellement aller chercher du contexte récent au lieu de travailler uniquement avec les données techniques.

Important : ce n’est pas exactement cette conversation ChatGPT qui reste ouverte en permanence. C’est un agent séparé utilisant un modèle OpenAI via API, avec ses propres appels et la recherche web. C’est la bonne architecture pour avoir une surveillance autonome 24/7.
Mise en place

D’abord exécute :

supabase_v9.sql

dans Supabase → SQL Editor.

Ensuite, dans GitHub :

app_bourse.py
← contenu de app_bourse_v9.py

market_agent.py
← nouveau fichier

.github/workflows/market_agent.yml
← contenu de market_agent_workflow.yml

requirements.txt
← contenu de requirements_v9.txt

Puis dans GitHub → Settings → Secrets and variables → Actions, ajoute :

SUPABASE_URL
SUPABASE_SERVICE_KEY
OPENAI_API_KEY
OPENAI_MODEL

Pour OPENAI_MODEL, tu peux mettre :

gpt-5.6-luna

qui est actuellement un modèle OpenAI disponible et adapté aux workloads sensibles au coût.

L’API key doit rester uniquement dans les secrets GitHub/Streamlit, jamais dans le code. OpenAI recommande également de stocker la clé dans une variable d’environnement côté serveur.
Concernant XTB et Trade Republic

Le scanner peut être compatible avec les deux courtiers via la nouvelle table :

broker_universe

Elle contient :

symbol
isin
market
asset_type
broker
enabled

Donc à terme on pourra avoir par exemple :

NVDA     USA       XTB
NVDA     USA       Trade Republic
AIR.PA   France    XTB
AIR.PA   France    Trade Republic
XXXX     Germany   Trade Republic uniquement

C’est beaucoup plus fiable que de supposer qu’une action est disponible chez les deux.

Je précise toutefois une limite importante : on ne peut pas connecter directement VISION FUTURE à XTB pour envoyer des ordres. XTB confirme officiellement que son API a été arrêtée le 14 mars 2025.

Pour Trade Republic, leur API officielle exposée publiquement concerne l’Open Banking DSP2 destiné aux prestataires tiers qualifiés, pas une API grand public permettant d’automatiser les achats/ventes du CTO.

Donc notre architecture reste :

analyse automatique → alerte → décision utilisateur → ordre manuel chez le courtier.
